<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Stránka je jen pro toho, kdo dostal odkaz — do vyhledávačů nepatří. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Náhled projektu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- three.js pro 3D náhled — stáhne se, až když někdo 3D otevře. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
/*
 * Webový náhled projektu pro zadavatele.
 *
 * Jeden soubor bez sestavování: GitHub Pages ho vydá, jak je. Data čte
 * ze Supabase veřejným klíčem, a to jen přes dvě funkce, které chtějí kód
 * z odkazu (supabase/schema.sql). Vzhled drží appku: stejné barvy, stavy
 * a pořadí sestava → podsestava → díl.
 */
:root {
  --bg: #f4f5f7;
  --plocha: #ffffff;
  --okraj: #dce4ea;
  --text: #15293a;
  --text-2: #5d7488;
  --text-3: #8aa0b0;
  --pole: #a9bac7;
  --akcent: #15293a;
  --akcent-2: #0e1d2b;
  --na-akcentu: #ffffff;
  --akcent-jemny: rgba(21, 41, 58, 0.05);
  --chyba: #b3261e;
  --chyba-bg: #fef2f2;
  --stin: 0 20px 50px rgba(15, 30, 45, 0.18);
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--mono); }

/* ── Hlavička ─────────────────────────────────────────────── */
.lista {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--okraj); background: var(--plocha);
}
.lista .znacka {
  width: 32px; height: 32px; border-radius: 8px; flex: none;
  display: grid; place-items: center;
  background: var(--akcent); color: var(--na-akcentu);
  font-weight: 700; font-size: 13px; letter-spacing: 0.02em;
}
.lista .co { font-size: 13px; color: var(--text-2); }
.lista .co b { color: var(--text); font-weight: 600; }

main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }

.projekt .kod { font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; color: var(--akcent); }
.projekt h1 { margin: 2px 0 6px; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
.projekt .meta { font-size: 13px; color: var(--text-3); }
.souhrn { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 32px; }

/* ── Stavy (stejné barvy jako v appce) ───────────────────── */
.stav {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid; border-radius: 999px; padding: 2px 10px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.stav.velky { padding: 4px 12px; font-size: 13px; }
/* Tečka jen v souhrnu nahoře — štítky v řádcích ji v appce nemají. */
.souhrn .stav { font-size: 12px; padding: 2px 10px; }
.souhrn .stav::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tecka); }
.stav.rozpracovany { --tecka: #fbbf24; border-color: #fde68a; background: #fffbeb; color: #78350f; }
.stav.hotovy       { --tecka: #16a34a; border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
.stav.keKontrole   { --tecka: #f87171; border-color: #fecaca; background: #fef2f2; color: #b3261e; }
.stav.vydany       { --tecka: #3b82f6; border-color: #bfdbfe; background: #eff6ff; color: #1e40af; }
.stav.reference    { --tecka: #8b5cf6; border-color: #ddd6fe; background: #f5f3ff; color: #5b21b6; }
.stav.zruseny      { --tecka: #b91c1c; border-color: #fca5a5; background: #fef2f2; color: #b3261e; }
.stav .pocet { font-variant-numeric: tabular-nums; opacity: 0.75; }

/* ── Koše položek ────────────────────────────────────────── */
.kos { margin-bottom: 28px; }
.kos h2 {
  display: flex; align-items: center; gap: 12px; margin: 0;
  padding: 8px 16px; border: 1px solid var(--okraj); border-bottom: 0;
  border-radius: 8px 8px 0 0;
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--akcent);
}
/* Sytost záhlaví jde po stavbě výrobku jako v appce: celek nejtmavší. */
.kos.sestava h2 { background: rgba(21, 41, 58, 0.20); }
.kos.podsestava h2 { background: rgba(21, 41, 58, 0.11); }
.kos.dil h2 { background: rgba(21, 41, 58, 0.05); }
.kos h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-3); font-size: 11px; }
.radky { border: 1px solid var(--okraj); border-radius: 0 0 8px 8px; background: var(--plocha); overflow: hidden; }
/* Šířky sloupců jako v appce: číslo 74, materiál 112, revize 56, stav 112. */
.radek, .zahlavi {
  display: grid; grid-template-columns: 74px minmax(0, 1fr) 112px 56px 112px 16px;
  align-items: center; gap: 16px; width: 100%; padding: 10px 16px;
}
.radek { border: 0; border-bottom: 1px solid var(--okraj); background: none; text-align: left; }
.radek:last-child { border-bottom: 0; }
.radek:hover { background: var(--bg); }
.radek.ztlumeny { opacity: 0.55; }
/* Zrušený a referenční díl podbarvené jako v appce. Po nich se nic nechce,
   takže se netlumí ani bez souboru — podbarvení už řeklo svoje. */
.radek.zruseny { background: #fef2f2; }
.radek.zruseny:hover { background: rgba(254, 242, 242, 0.7); }
.radek.reference { background: rgba(245, 243, 255, 0.7); }
.radek.reference:hover { background: rgba(237, 233, 254, 0.6); }
.radek .cislo { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.radek .cislo .predpona { color: var(--akcent); }
.radek .cislo .zbytek { font-weight: 500; }
.radek .popis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
.radek .popis.prazdny { font-weight: 400; font-style: italic; color: var(--text-3); }
.radek .material { font-size: 12px; color: var(--text-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radek .rev-bunka { justify-self: end; }
.radek .stav-bunka { justify-self: center; }
.radek .sipka { color: var(--text-3); text-align: right; }
/* Bublina s počtem komentářů u popisu, jako v appce. */
.bublina {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; vertical-align: 1px;
  border: 1px solid var(--okraj); border-radius: 999px; padding: 0 6px;
  font-size: 11px; font-weight: 500; font-style: normal; color: var(--text-3);
}
.bublina svg { width: 12px; height: 12px; }
.revize { font-family: var(--mono); font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }
.revize .puvodni { opacity: 0.4; }
/* Vydáno: plná zelená tečka. Nevydáno: jen obrys — je to stav, ne chyba. */
.revize .vydano { width: 8px; height: 8px; border-radius: 50%; background: #15803d; }
.revize .nevydano { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--text-3); opacity: 0.5; }
.zahlavi {
  padding: 6px 16px; border-bottom: 1px solid var(--okraj); background: var(--bg);
  font-size: 10px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3);
}
.zahlavi .vpravo { text-align: right; }
.zahlavi .stred { text-align: center; }
@media (max-width: 720px) {
  .radek, .zahlavi { grid-template-columns: 74px minmax(0, 1fr) auto; row-gap: 4px; gap: 12px; }
  .zahlavi { display: none; }
  .radek .material, .radek .sipka { display: none; }
  .radek .rev-bunka { grid-column: 3; grid-row: 1; }
  .radek .stav-bunka { grid-column: 2 / 4; grid-row: 2; justify-self: start; }
}

/* ── Komentáře ───────────────────────────────────────────── */
.komentare h3 {
  display: flex; align-items: baseline; gap: 8px;
  margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--text);
}
.komentare h3 span { font-size: 13px; font-weight: 400; color: var(--text-3); }
.komentare ul { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 12px; }
/* Každý komentář velký obdélník: autor vlevo, datum a čas vpravo, text
   pod tím — stejně jako v appce. Odpovědi autora jemně tónované. */
.komentar { border: 1px solid var(--okraj); border-radius: 8px; padding: 12px 16px; background: var(--plocha); }
.komentar.od-autora { border-color: rgba(21, 41, 58, 0.2); background: var(--akcent-jemny); }
.komentar .hlavicka { display: flex; align-items: baseline; gap: 8px; }
.komentar .autor { font-size: 14px; font-weight: 600; }
.komentar .cas { margin-left: auto; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.komentar .text { margin-top: 4px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.komentare .prazdno { font-size: 14px; color: var(--text-3); margin: 0 0 12px; }
.formular { display: grid; gap: 8px; }
.formular input, .formular textarea {
  width: 100%; border: 1px solid var(--pole); border-radius: 8px;
  background: var(--plocha); padding: 8px 12px; outline: none;
}
.formular input:focus, .formular textarea:focus { border-color: var(--akcent); }
.formular textarea { resize: vertical; min-height: 64px; border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.formular .dole { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.formular .dole input { flex: 1 1 200px; width: auto; }
.tl {
  height: 36px; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--akcent); background: var(--akcent); color: var(--na-akcentu);
  font-size: 13px; font-weight: 500;
}
.tl:hover:not(:disabled) { background: var(--akcent-2); border-color: var(--akcent-2); }
.tl:disabled { opacity: 0.45; cursor: not-allowed; }
.tl.vedlejsi { background: var(--plocha); color: var(--text); border-color: var(--pole); }
.tl.vedlejsi:hover:not(:disabled) { background: var(--bg); border-color: var(--pole); }
.chyba { color: var(--chyba); font-size: 13px; }

/* Heslo — místo přehledu, dokud ho zadavatel nezadá */
.heslo { display: grid; gap: 10px; justify-items: center; }
.heslo input {
  width: 100%; max-width: 280px; border: 1px solid var(--pole); border-radius: 8px;
  background: var(--plocha); padding: 8px 12px; outline: none; font-size: 15px; text-align: center;
}
.heslo input:focus { border-color: var(--akcent); }
.heslo .chyba { margin: 0; }
.karta { border: 1px solid var(--okraj); border-radius: 10px; background: var(--plocha); padding: 16px; }

/* ── Detail dílu — karta uprostřed, rozložená jako v appce ── */
.pozadi {
  position: fixed; inset: 0; z-index: 10; background: rgba(21, 41, 58, 0.35);
  display: flex; align-items: center; justify-content: center; padding: 32px;
}
.detail {
  width: 100%; max-width: 1024px; max-height: 100%; overflow: auto;
  background: var(--plocha); border: 1px solid var(--okraj); border-radius: 12px; box-shadow: var(--stin);
}
.detail .hlava {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 16px 24px; border-bottom: 1px solid var(--okraj);
}
.detail .hlava .cislo { font-family: var(--mono); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
.detail .hlava .popis { margin: 2px 0 0; font-size: 15px; }
.krizek {
  border: 0; background: none; border-radius: 6px; padding: 4px 8px;
  font-size: 20px; line-height: 1; color: var(--text-3);
}
.krizek:hover { background: var(--bg); color: var(--text); }
.detail .telo { display: flex; gap: 24px; padding: 24px; }
.levy { width: 420px; flex: none; }
.ramecek {
  position: relative; aspect-ratio: 1.41; width: 100%;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  border: 1px solid var(--okraj); border-radius: 8px; background: #fff;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.ramecek img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; }
.ramecek .nic { margin: 0; padding: 24px 16px; text-align: center; font-size: 12px; color: var(--text-3); }
.ramecek .zvetsit {
  position: absolute; inset: 0; border: 0; background: none; cursor: zoom-in;
  display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px;
}
.ramecek .zvetsit span {
  border-radius: 6px; background: rgba(255, 255, 255, 0.85); padding: 4px 8px;
  font-size: 11px; font-weight: 500; color: var(--text-2);
  box-shadow: 0 1px 2px rgba(15, 30, 45, 0.1); opacity: 0; transition: opacity 0.15s;
}
.ramecek .zvetsit:hover span { opacity: 1; }
.prepinac {
  margin-top: 8px; display: flex; gap: 4px; padding: 4px;
  border: 1px solid var(--okraj); border-radius: 8px; background: var(--bg);
}
.prepinac button {
  flex: 1; border: 0; background: none; border-radius: 4px; padding: 4px 8px;
  font-size: 12px; font-weight: 500; color: var(--text-2);
}
.prepinac button:hover { color: var(--text); }
.prepinac button.aktivni { background: var(--plocha); color: var(--text); box-shadow: 0 1px 2px rgba(15, 30, 45, 0.08); }
.prepinac button.chybi { opacity: 0.45; }
dl.udaje { flex: 1; min-width: 0; margin: 0; font-size: 14px; }
.udaj { display: flex; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--okraj); }
.udaj:last-child { border-bottom: 0; }
.udaj dt { width: 128px; flex: none; font-size: 13px; color: var(--text-3); }
.udaj dd { margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.udaj dd.vice-radku { white-space: pre-wrap; }
.udaj b { font-weight: 500; }
.udaj ol { margin: 0; padding: 0; list-style: none; }
.udaj .kdy { margin-left: 8px; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.udaj .vydani li { font-size: 13px; }
.tlumene { color: var(--text-3); font-style: italic; }
.varovani { margin-top: 4px; font-size: 12px; color: #78350f; }
.historie-tl {
  margin-left: 6px; border: 0; background: none; border-radius: 4px; padding: 2px 6px;
  font-size: 12px; color: var(--text-2);
}
.historie-tl:hover { background: var(--bg); color: var(--text); }
.udaj .denik { margin: 8px 0 0; padding-left: 12px; border-left: 1px solid var(--okraj); display: grid; gap: 6px; }
/* Plynulé rozbalení jako v appce: výška jede přes grid-template-rows.
   Přepíná se třídou přímo na prvku, ne překreslením — jinak by se
   rozbalení neanimovalo. */
.rozbal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s ease-in-out; }
.rozbal.otevreno { grid-template-rows: 1fr; }
.rozbal > div { min-height: 0; overflow: hidden; }
.historie-tl svg { width: 12px; height: 12px; vertical-align: -1px; transition: transform 0.3s; }
.historie-tl.otevreno svg { transform: rotate(180deg); }
.radek-udaje { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; }
.denik li { font-size: 13px; }
.denik .poznamka { color: var(--text-2); }
.okoli { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 20px 24px; border-top: 1px solid var(--okraj); }
.okoli h3 {
  margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-3);
}
.okoli h3 span { margin-left: 8px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.okoli ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.soused {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  border: 0; background: none; border-radius: 4px; padding: 4px 8px; text-align: left;
}
.soused:hover:not(:disabled) { background: var(--bg); }
.soused:disabled { cursor: default; color: inherit; }
.soused .mono { flex: none; font-size: 13px; font-variant-numeric: tabular-nums; }
.soused .popis { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--text-2); }
.soused .sipka { font-size: 11px; color: var(--text-3); }
.okoli .napoveda { margin: 8px 0 0; padding: 0 8px; font-size: 11px; color: var(--text-3); }
.okoli .prazdne { margin: 8px 0 0; font-size: 13px; color: var(--text-3); font-style: italic; }
.detail .sekce { padding: 20px 24px; border-top: 1px solid var(--okraj); }
@media (max-width: 640px) {
  .pozadi { padding: 0; }
  .detail { height: 100%; max-height: none; border: 0; border-radius: 0; }
  .detail .telo { flex-direction: column; padding: 16px; }
  .levy { width: 100%; }
  .okoli { grid-template-columns: 1fr; }
  .udaj dt { width: 104px; }
}

/* ── Lupa na výkres ──────────────────────────────────────── */
.lupa {
  position: fixed; inset: 0; z-index: 20; background: rgba(8, 16, 24, 0.85);
  overflow: auto; display: grid; place-items: center; padding: 16px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.lupa img { max-width: 100%; max-height: calc(100vh - 32px); background: #fff; cursor: zoom-in; -webkit-user-drag: none; }
.lupa.plna { place-items: start; }
.lupa.plna img { max-width: none; max-height: none; cursor: zoom-out; }
.lupa .zavrit {
  position: fixed; top: 12px; right: 12px; z-index: 21;
  height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: #fff; color: #15293a; font-size: 13px; font-weight: 500;
}

/* ── 3D náhled ───────────────────────────────────────────── */
.misto3d { position: absolute; inset: 0; }
.prohlizec3d { position: absolute; inset: 0; container-type: size; background: #fff; cursor: grab; touch-action: none; }
.prohlizec3d:active { cursor: grabbing; }
.prohlizec3d canvas { display: block; width: 100%; height: 100%; outline: none; }
.prohlizec3d .vodoznak3d { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; pointer-events: none; }
.prohlizec3d .vodoznak3d span {
  transform: rotate(-32deg); white-space: nowrap; letter-spacing: 0.1em;
  font-size: 4.6cqw; font-weight: 700; color: rgba(198, 40, 40, 0.16);
}
.prohlizec3d .stav3d {
  position: absolute; inset: 0; margin: 0; display: grid; place-items: center;
  font-size: 12px; color: var(--text-3); pointer-events: none;
}
.prohlizec3d .napoveda3d, .prohlizec3d .zvetsit3d {
  position: absolute; bottom: 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.85);
  padding: 4px 8px; font-size: 11px; font-weight: 500; color: var(--text-2);
  box-shadow: 0 1px 2px rgba(15, 30, 45, 0.1);
}
.prohlizec3d .napoveda3d { left: 8px; margin: 0; pointer-events: none; transition: opacity 0.4s; }
.prohlizec3d.pouzito .napoveda3d { opacity: 0; }
.prohlizec3d .zvetsit3d { right: 8px; border: 0; cursor: zoom-in; }
.prohlizec3d .zvetsit3d:hover { color: var(--text); }
.lupa .prohlizec3d { position: relative; inset: auto; width: 100%; height: calc(100vh - 32px); border-radius: 8px; }
.lupa .prohlizec3d .zvetsit3d { display: none; }

/* ── Stavy stránky ───────────────────────────────────────── */
.hlaska { max-width: 560px; margin: 80px auto; text-align: center; color: var(--text-2); padding: 0 16px; }
.hlaska h1 { font-size: 20px; color: var(--text); margin: 0 0 8px; }
footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 40px; font-size: 12px; color: var(--text-3); }
/* ── Animace — stejné křivky a délky jako v appce ─────────── */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes radekIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes kartaIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes popOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.94) translateY(6px); } }
@keyframes toc { to { transform: rotate(360deg); } }
.anim-fade { animation: fadeIn 0.34s ease-out both; }
.anim-karta { animation: kartaIn 0.4s cubic-bezier(0.2, 0.85, 0.25, 1) backwards; }
.anim-radek { animation: radekIn 0.28s ease-out backwards; }
.pozadi.otvira { animation: fadeIn 0.34s ease-out both; }
.pozadi.otvira .detail { animation: popIn 0.42s cubic-bezier(0.2, 0.85, 0.25, 1) backwards; }
.pozadi.zavira { animation: fadeOut 0.28s ease-in both; }
.pozadi.zavira .detail { animation: popOut 0.28s ease-in both; }
.detail.prepnuti > * { animation: fadeIn 0.3s ease-out both; }
.lupa.otvira { animation: fadeIn 0.25s ease-out both; }
.lupa.zavira { animation: fadeOut 0.2s ease-in both; }
/* Odezva tlačítek: plynulé přebarvení a jemné zmáčknutí. Rozbalovací
   přepínače (historie, starší vydání) a řádky se nemačkají — pohyb dělá
   samo rozbalení nebo otevření detailu. */
.tl, .krizek, .prepinac button, .soused, .historie-tl, .zavrit, .obnovit, .radek {
  transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease,
    box-shadow 0.14s ease, opacity 0.14s ease, transform 0.09s ease;
}
.tl:not(:disabled):active, .krizek:active, .prepinac button:active, .zavrit:active, .obnovit:active {
  transform: scale(0.96);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Ruční obnovení vedle „aktualizováno" */
.obnovit {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 6px;
  border: 1px solid var(--okraj); border-radius: 999px; background: var(--plocha);
  padding: 1px 9px 1px 7px; font-size: 12px; color: var(--text-2); vertical-align: 1px;
}
.obnovit:hover { border-color: var(--pole); color: var(--text); }
.obnovit svg { width: 12px; height: 12px; }
.obnovit.toci svg { animation: toc 0.8s linear infinite; }

/* ── Vzhled 5.0 (2026-10): stejný jako appka po redesignu ────
   Karty s měkkým stínem a zaoblením 20 px, štítky stavu jako v CRM
   (rámeček a písmo sytě, výplň světle), segmentový přepínač, tichá
   hlavička tabulky. Přepisuje pravidla výš — logika stránky se nemění. */
:root {
  --line: #dce4ea;
  --stin-karta: 0 10px 60px rgba(186, 204, 222, 0.45);
  --stin-okno: 0 24px 60px rgba(21, 41, 58, 0.25);
}
.lista {
  padding: 14px 24px; border-bottom: 0; box-shadow: var(--stin-karta); position: relative; z-index: 1;
}
.lista .znacka {
  width: 36px; height: 36px; border-radius: 10px; font-size: 14px;
  background: linear-gradient(to bottom, #34465a, #142636);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 3px 8px -3px rgba(21, 41, 58, 0.5);
}
main { padding: 36px 24px 64px; }
.projekt h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.projekt .kod { font-weight: 600; }
.souhrn { gap: 8px; margin: 18px 0 28px; }

.stav { border-radius: 6px; font-weight: 600; padding: 2px 8px; }
.stav.velky { padding: 4px 12px; }
.souhrn .stav { padding: 4px 12px; font-size: 13px; }
.stav.rozpracovany { --tecka: #f2c27a; border-color: #f2c27a; background: #fdf1e2; color: #92400e; }
.stav.hotovy       { --tecka: #86d3a1; border-color: #86d3a1; background: #e7f6ec; color: #15803d; }
.stav.keKontrole   { --tecka: #f3a3a3; border-color: #f3a3a3; background: #fdeaea; color: #b91c1c; }
.stav.vydany       { --tecka: #9cc2ea; border-color: #9cc2ea; background: #e8f1fb; color: #1d4f8c; }
.stav.reference    { --tecka: #c7b5ec; border-color: #c7b5ec; background: #f2edfb; color: #5b3aa8; }
.stav.zruseny      { --tecka: #d79a9a; border-color: #d79a9a; background: #f6e3e3; color: #7f1d1d; }

/* Koš = karta se seznamem: nadpis s počtem nahoře, řádky pod ním. */
.kos {
  margin-bottom: 24px; padding: 24px 28px 12px;
  background: var(--plocha); border-radius: 20px; box-shadow: var(--stin-karta);
}
.kos h2,
.kos.sestava h2, .kos.podsestava h2, .kos.dil h2 {
  padding: 0 0 12px; border: 0; border-radius: 0; background: none;
  font-size: 20px; font-weight: 600; letter-spacing: -0.01em; text-transform: none; color: var(--text);
}
.kos h2 span {
  border-radius: 999px; background: #eef2f5; padding: 2px 8px;
  font-size: 12px; font-weight: 600; color: #5d7488;
}
.radky { border: 0; border-radius: 0; background: none; }
.radek, .zahlavi { padding: 14px 12px; }
.radek { border-bottom: 1px solid var(--line); }
.radek:last-child { border-bottom: 0; }
.radek:hover { background: rgba(244, 245, 247, 0.6); }
.radek.zruseny { background: rgba(246, 227, 227, 0.6); }
.radek.zruseny:hover { background: #f6e3e3; }
.radek.reference { background: rgba(242, 237, 251, 0.6); }
.radek.reference:hover { background: #f2edfb; }
.radek .cislo { font-size: 14px; }
.radek .cislo .zbytek { font-weight: 600; }
.zahlavi {
  padding: 10px 12px; background: none; border-bottom: 1px solid var(--okraj);
  font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--text-3);
}

/* Komentáře a karty */
.karta { border: 0; border-radius: 20px; box-shadow: var(--stin-karta); padding: 24px; }
.komentar { border-radius: 12px; border-color: var(--line); }
.formular input, .formular textarea, .heslo input { border-radius: 10px; border-color: var(--okraj); }
.formular textarea { border-radius: 12px; }

/* Tlačítka jako v appce */
.tl { height: 38px; border-radius: 10px; font-weight: 600; }
.tl.vedlejsi { font-weight: 500; border-color: var(--okraj); }

/* Detail dílu = okno appky */
.pozadi { background: rgba(11, 20, 32, 0.45); }
.detail { border: 0; border-radius: 20px; box-shadow: var(--stin-okno); }
.detail .hlava { padding: 20px 24px; border-bottom-color: var(--line); }
.detail .hlava .cislo { font-size: 20px; font-weight: 600; }
.krizek {
  width: 32px; height: 32px; padding: 0; border-radius: 8px;
  display: grid; place-items: center; background: var(--bg); font-size: 18px; color: var(--text-2);
}
.ramecek { border-color: var(--line); border-radius: 12px; }
/* Model / Výkres / 3D — segmentový přepínač */
.prepinac { margin-top: 12px; gap: 2px; border: 0; border-radius: 10px; background: var(--bg); }
.prepinac button { height: 30px; border-radius: 7px; font-size: 13px; }
.prepinac button.aktivni { font-weight: 600; box-shadow: 0 1px 2px rgba(15, 30, 45, 0.12); }
.udaj { padding: 10px 0; border-bottom-color: var(--line); }
.okoli, .detail .sekce { border-top-color: var(--line); }
.soused { border-radius: 8px; padding: 6px 8px; }
.obnovit { border-radius: 8px; }

/* Zmáčknutí jemněji, řádky skoro vůbec — jako v appce */
.tl:not(:disabled):active, .krizek:active, .prepinac button:active, .zavrit:active, .obnovit:active {
  transform: scale(0.97);
}
@media (max-width: 720px) {
  .kos { padding: 18px 16px 8px; border-radius: 16px; }
  .radek { padding: 12px 6px; }
}

[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="lista">
  <div class="znacka" aria-hidden="true">JH</div>
  <div class="co"><b>Jan Hrnek</b> · náhled projektu</div>
</div>
<main id="obsah"><p class="hlaska">Načítám…</p></main>
<footer id="paticka" hidden>
  Náhled stavu konstrukce. Obrázky jsou jen pro orientaci a nejsou platné pro
  výrobu. Aktualizuje se samo zhruba každou minutu.
</footer>
<div id="pozadi" class="pozadi" hidden>
  <aside id="detail" class="detail" aria-modal="true" role="dialog"></aside>
</div>
<div id="lupa" class="lupa" hidden></div>

<script>
"use strict";

// Veřejné údaje projektu v Supabase — k tabulkám se s nimi nikdo nedostane,
// jen ke dvěma funkcím, které chtějí kód z odkazu.
const URL_PROJEKTU = "https://krjklzhmjfrobxirgfss.supabase.co";
const KLIC = "sb_publishable_kELuD5fKHK50JOYhleZWkw_WM_jgPhw";
const OBNOVA_MS = 60_000;

const NAZVY_STAVU = {
  rozpracovany: "Rozpracovaný",
  keKontrole: "Ke kontrole",
  vydany: "Vydaný",
  hotovy: "Hotový",
  reference: "Reference",
  zruseny: "Zrušený",
};
const NAZVY_TYPU = { D: "Díl", S: "Podsestava", SV: "Vrcholová sestava" };
const SKUPINY = [
  ["sestava", "Vrcholové sestavy"],
  ["podsestava", "Podsestavy"],
  ["dil", "Díly"],
];

const kod = decodeURIComponent(location.hash.slice(1)).trim();
const demo = kod === "demo";
let nahled = null;        // odpověď funkce `nahled`
let prvniVykresleni = true; // řádky naskakují jen poprvé, ne při každém obnovení
let nacitam = false;      // běží ruční obnovení
let animujNahled = false; // přepnutí Model/Výkres — obrázek se prolne
let casovacZavreni = 0;
let otevrene = null;      // číslo otevřeného dílu
let zobrazeni = "model";  // co ukazuje náhled v detailu
let chybaFormulare = {};  // podle čísla
let rozbaleno = {};       // rozbalená historie revizí / starší vydání v detailu
let stiskNaPozadi = false; // detail zavře jen klik, který na pozadí i začal
let heslo = ulozeneHeslo(); // heslo sdílení (má-li ho), zapamatované z minula
let cekaNaHeslo = false;    // na obrazovce je formulář na heslo

// ── Pomocníci ──────────────────────────────────────────────

const $ = (id) => document.getElementById(id);

function h(text) {
  return String(text ?? "").replace(/[&<>"']/g, (z) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[z]);
}

function sklonuj(n, jedna, dva, pet) {
  return n === 1 ? jedna : n >= 2 && n <= 4 ? dva : pet;
}

function kdy(iso, sCasem = true) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return h(iso);
  return d.toLocaleString("cs-CZ", sCasem
    ? { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }
    : { day: "numeric", month: "numeric", year: "numeric" });
}

function adresaObrazku(cesta) {
  if (!cesta) return null;
  return cesta.startsWith("data:") ? cesta : `${URL_PROJEKTU}/storage/v1/object/public/nahledy/${cesta}`;
}

// Jméno u komentáře se nepamatuje — pole je vždy prázdné. Na sdíleném
// počítači by jinak další člověk psal pod cizím jménem. Dřív uložené
// jméno se při otevření stránky smaže.
try { localStorage.removeItem("nahled-jmeno"); } catch { /* soukromé okno */ }
function jmeno() {
  return "";
}
function zapamatujJmeno() {
  /* záměrně nic — viz výš */
}
// Heslo se pamatuje k odkazu (kódu), ať se nemusí psát pokaždé. Když ho
// Honza změní, staré přestane platit a stránka se zeptá znovu.
function ulozeneHeslo() {
  try { return localStorage.getItem(`nahled-heslo:${kod}`) || ""; } catch { return ""; }
}
function zapamatujHeslo(h) {
  try {
    if (h) localStorage.setItem(`nahled-heslo:${kod}`, h);
    else localStorage.removeItem(`nahled-heslo:${kod}`);
  } catch { /* soukromé okno */ }
}

async function rpc(funkce, argumenty) {
  const odpoved = await fetch(`${URL_PROJEKTU}/rest/v1/rpc/${funkce}`, {
    method: "POST",
    headers: { apikey: KLIC, "Content-Type": "application/json" },
    body: JSON.stringify(argumenty),
  });
  const text = await odpoved.text();
  if (!odpoved.ok) {
    let zprava = "";
    try { zprava = JSON.parse(text).message; } catch { /* není JSON */ }
    throw new Error(zprava || `Server odpověděl chybou ${odpoved.status}.`);
  }
  return text ? JSON.parse(text) : null;
}

// ── Data ───────────────────────────────────────────────────

async function nacti() {
  if (demo) return ukazkovaData();
  // Heslo jen když nějaké je — sdílení bez hesla ho nepotřebuje.
  return rpc("nahled", heslo ? { p_kod: kod, p_heslo: heslo } : { p_kod: kod });
}

async function obnov() {
  // Při psaní hesla se neobnovuje — formulář by se překreslil pod rukama.
  if (cekaNaHeslo) return;
  try {
    const novy = await nacti();
    if (novy?.chceHeslo) {
      // Bez hesla, se špatným, nebo ho Honza mezitím změnil.
      nahled = null;
      zavriDetail();
      zapamatujHeslo("");
      heslo = "";
      zobrazHeslo(novy.spatneHeslo);
      return;
    }
    if (novy && heslo) zapamatujHeslo(heslo);
    if (!novy) {
      nahled = null;
      zavriDetail();
      zobrazHlasku(
        "Odkaz už neplatí",
        "Sdílení bylo vypnuto nebo dostalo nový odkaz. Požádejte o aktuální."
      );
      return;
    }
    nahled = novy;
    vykresli();
  } catch (e) {
    // Při výpadku spojení nech na obrazovce poslední stav.
    if (!nahled) zobrazHlasku("Náhled se nepodařilo načíst", e.message);
  }
}

function polozky() {
  return (nahled?.data?.polozky ?? []);
}

function komentareK(cislo) {
  return (nahled?.komentare ?? []).filter((k) => (k.cislo || "") === cislo);
}

// ── Přehled ────────────────────────────────────────────────

function zobrazHlasku(nadpis, text) {
  $("obsah").innerHTML = `<div class="hlaska"><h1>${h(nadpis)}</h1><p>${h(text)}</p></div>`;
  $("paticka").hidden = true;
}

function zobrazHeslo(spatne) {
  cekaNaHeslo = true;
  $("obsah").innerHTML = `
    <form class="hlaska heslo" id="heslo">
      <h1>Náhled je chráněný heslem</h1>
      <input type="password" name="heslo" autocomplete="current-password" aria-label="Heslo" required autofocus>
      <button class="tl">Otevřít</button>
      ${spatne ? `<p class="chyba">Heslo nesedí.</p>` : ""}
    </form>`;
  $("paticka").hidden = true;
  $("heslo").heslo.focus();
}

async function odesliHeslo(formular) {
  heslo = formular.heslo.value.trim();
  if (!heslo) return;
  const tlacitko = formular.querySelector("button");
  tlacitko.disabled = true;
  tlacitko.textContent = "Ověřuji…";
  cekaNaHeslo = false;
  prvniVykresleni = true;
  await obnov();
}

/** Rozepsaný komentář nesmí obnovení dat smazat — ani text, ani kurzor. */
function zachovejRozepsane(kde, prekresli) {
  const pred = document.querySelector(`${kde} textarea`);
  const text = pred?.value ?? "";
  const fokus = pred !== null && document.activeElement === pred;
  prekresli();
  const po = document.querySelector(`${kde} textarea`);
  if (po && text) po.value = text;
  if (po && fokus) po.focus();
}

function vykresli() {
  zachovejRozepsane("#komentare-projektu", vykresliPrehled);
  if (otevrene) vykresliDetail();
}

function vykresliPrehled() {
  const vse = polozky();
  document.title = `${nahled.projekt} ${nahled.nazev || ""} — náhled`.trim();

  const pocty = {};
  for (const p of vse) pocty[p.stav] = (pocty[p.stav] || 0) + 1;
  const souhrn = Object.keys(NAZVY_STAVU)
    .filter((s) => pocty[s])
    .map((s) => `<span class="stav ${s}">${NAZVY_STAVU[s]} <span class="pocet">${pocty[s]}</span></span>`)
    .join("");

  // Při prvním načtení karty a řádky naskočí po sobě jako v appce.
  // Při obnovení každou minutu ne — to by stránka pořád poskakovala.
  const anim = prvniVykresleni;
  const zpozdeni = (ms) => (anim ? ` style="animation-delay:${ms}ms"` : "");
  let poradiKose = 0;
  const kose = SKUPINY.map(([skupina, nadpis]) => {
    const radky = vse.filter((p) => p.skupina === skupina);
    if (!radky.length) return "";
    const zacatek = 80 + poradiKose++ * 70;
    return `
      <section class="kos ${skupina}${anim ? " anim-karta" : ""}"${zpozdeni(zacatek)}>
        <h2>${nadpis} <span>${radky.length}</span></h2>
        <div class="radky">
          <div class="zahlavi"><span>Číslo</span><span>Popis</span><span class="vpravo">Materiál</span><span class="vpravo">Rev.</span><span class="stred">Stav</span><span></span></div>
          ${radky.map((p, i) => radek(p, anim ? zacatek + 60 + Math.min(i, 14) * 16 : null)).join("")}
        </div>
      </section>`;
  }).join("");
  const sipkaObnovit = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16 3.5v3.2h-3.2"/></svg>`;

  $("obsah").innerHTML = `
    <section class="projekt${anim ? " anim-fade" : ""}">
      <div class="kod">${h(nahled.projekt)}</div>
      <h1>${h(nahled.nazev || nahled.projekt)}</h1>
      <div class="meta">
        ${vse.length} ${sklonuj(vse.length, "položka", "položky", "položek")}
        · aktualizováno ${kdy(nahled.aktualizovano)}
        <button class="obnovit${nacitam ? " toci" : ""}" data-obnovit
          title="Načíst znovu — jinak se stránka obnovuje sama každou minutu">${sipkaObnovit}Obnovit</button>
      </div>
    </section>
    <div class="souhrn${anim ? " anim-fade" : ""}">${souhrn}</div>
    ${kose || `<p class="hlaska">Projekt zatím nemá žádné díly.</p>`}
    <section class="karta komentare${anim ? " anim-karta" : ""}" id="komentare-projektu"${zpozdeni(80 + poradiKose * 70)}>
      ${komentareHtml("", "Komentáře k projektu")}
    </section>`;
  $("paticka").hidden = false;
  prvniVykresleni = false;
}

/** Ruční obnovení. Šipka se točí aspoň chvilku, ať je vidět, že se něco stalo. */
async function obnovRucne() {
  if (nacitam) return;
  nacitam = true;
  document.querySelector("[data-obnovit]")?.classList.add("toci");
  await Promise.all([obnov(), new Promise((r) => setTimeout(r, 600))]);
  nacitam = false;
  document.querySelector("[data-obnovit]")?.classList.remove("toci");
}

function revize(p) {
  // Prázdná revize je originál — tichá čárka, ať písmeno revize bije do očí.
  const znak = p.revize ? h(p.revize) : `<span class="puvodni">–</span>`;
  const tecka = p.vydano
    ? `<span class="vydano" title="Výkres této revize je vydaný"></span>`
    : `<span class="nevydano" title="Výkres této revize ještě není vydaný"></span>`;
  return `<span class="revize">${znak}${tecka}</span>`;
}

function stitek(stav, velky = false) {
  return `<span class="stav ${h(stav)}${velky ? " velky" : ""}">${h(NAZVY_STAVU[stav] || stav)}</span>`;
}

/** Číslo jako v appce: předpona v barvě akcentu, pořadové číslo tučněji. */
function cislo(text) {
  const i = text.indexOf("-");
  if (i <= 0) return `<span class="zbytek">${h(text)}</span>`;
  return `<span class="predpona">${h(text.slice(0, i + 1))}</span><span class="zbytek">${h(text.slice(i + 1))}</span>`;
}

const IKONA_KOMENTARE = `<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6a1.5 1.5 0 0 1-1.5 1.5H7l-3 2.5V11h-.5A1.5 1.5 0 0 1 2 9.5z"/></svg>`;

function radek(p, zpozdeniMs = null) {
  const pocet = komentareK(p.cislo).length;
  const mimoHru = p.stav === "zruseny" || p.stav === "reference";
  const trida = [
    "radek",
    p.stav === "zruseny" ? "zruseny" : "",
    p.stav === "reference" ? "reference" : "",
    p.naDisku === false && !mimoHru ? "ztlumeny" : "",
    zpozdeniMs !== null ? "anim-radek" : "",
  ].filter(Boolean).join(" ");
  const styl = zpozdeniMs !== null ? ` style="animation-delay:${zpozdeniMs}ms"` : "";
  const popisek = p.stav === "zruseny"
    ? "Zrušený — díl zanikl"
    : p.stav === "reference"
      ? "Reference — díl se nevyrábí, je v projektu jen jako podklad"
      : "";
  return `
    <button class="${trida}" data-cislo="${h(p.cislo)}"${popisek ? ` title="${popisek}"` : ""}${styl}>
      <span class="cislo">${cislo(p.cislo)}</span>
      <span class="popis${p.popis ? "" : " prazdny"}" title="${h(p.popis)}">${h(p.popis) || "bez popisu"}${
        pocet ? `<span class="bublina" title="${pocet} ${sklonuj(pocet, "komentář", "komentáře", "komentářů")}">${IKONA_KOMENTARE}${pocet}</span>` : ""
      }</span>
      <span class="material" title="${h(p.material)}">${h(p.material) || "—"}</span>
      <span class="rev-bunka">${revize(p)}</span>
      <span class="stav-bunka">${stitek(p.stav)}</span>
      <span class="sipka">›</span>
    </button>`;
}

// ── Komentáře ──────────────────────────────────────────────

/** Čas u komentáře — letošní bez roku, ať je řádek krátký. */
function kdyKratce(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return h(iso);
  const letos = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleString("cs-CZ", {
    day: "numeric", month: "numeric", ...(letos ? {} : { year: "numeric" }),
    hour: "2-digit", minute: "2-digit",
  });
}

function komentareHtml(cislo, nadpis) {
  const seznam = komentareK(cislo);
  const polozky = seznam.length
    ? `<ul>${seznam.map((k) => `
        <li class="komentar${k.odZadavatele ? "" : " od-autora"}">
          <div class="hlavicka">
            <span class="autor">${h(k.autor)}</span>
            <span class="cas">${kdyKratce(k.vytvoreno)}</span>
          </div>
          <div class="text">${h(k.text)}</div>
        </li>`).join("")}</ul>`
    : `<p class="prazdno">${cislo ? "K tomuto dílu zatím nikdo nic nenapsal." : "Zatím žádné komentáře k projektu."}</p>`;
  const chyba = chybaFormulare[cislo] ? `<p class="chyba">${h(chybaFormulare[cislo])}</p>` : "";
  return `
    <h3>${h(nadpis)}${seznam.length ? `<span>${seznam.length}</span>` : ""}</h3>
    ${polozky}
    <form class="formular" data-cislo="${h(cislo)}">
      <textarea name="text" maxlength="4000" required
        placeholder="${cislo ? `Poznámka k ${h(cislo)}` : "Poznámka k celému projektu"}"></textarea>
      <div class="dole">
        <input name="autor" maxlength="80" required placeholder="Vaše jméno" value="${h(jmeno())}">
        <button class="tl" type="submit">Odeslat komentář</button>
      </div>
      ${chyba}
    </form>`;
}

async function odesliKomentar(formular) {
  const cislo = formular.dataset.cislo || "";
  const text = formular.text.value.trim();
  const autor = formular.autor.value.trim();
  if (!text || !autor) return;
  zapamatujJmeno(autor);
  const tlacitko = formular.querySelector("button");
  tlacitko.disabled = true;
  tlacitko.textContent = "Odesílám…";
  try {
    if (demo) {
      nahled.komentare.push({
        id: String(Date.now()), cislo, autor, text,
        odZadavatele: true, vytvoreno: new Date().toISOString(),
      });
    } else {
      await rpc("pridej_komentar", {
        p_kod: kod, p_cislo: cislo, p_autor: autor, p_text: text, ...(heslo ? { p_heslo: heslo } : {}),
      });
    }
    delete chybaFormulare[cislo];
    formular.text.value = "";
    await obnov();
  } catch (e) {
    chybaFormulare[cislo] = e.message;
    vykresli();
  }
}

function otevriDetail(cislo) {
  const pozadi = $("pozadi");
  const uzOtevreny = !pozadi.hidden && !pozadi.classList.contains("zavira");
  clearTimeout(casovacZavreni);
  otevrene = cislo;
  rozbaleno = {};
  // Model má přednost jako v appce; výkres, jen když model chybí.
  const nahledy = polozky().find((x) => x.cislo === cislo)?.nahledy || {};
  zobrazeni = !nahledy.model && nahledy.vykres ? "vykres" : "model";
  // Jiný díl = jiný komentář; rozepsaný text z předchozího sem nepatří.
  $("detail").innerHTML = "";
  vykresliDetail();
  $("detail").scrollTop = 0;

  pozadi.classList.remove("zavira");
  if (uzOtevreny) {
    // Jiný díl ve stejné kartě (proklik na sousední číslo) — karta zůstane,
    // jen se prolne obsah. Třída pryč hned po animaci, jinak by se prolínal
    // i při každém obnovení dat.
    const detail = $("detail");
    detail.classList.remove("prepnuti");
    void detail.offsetWidth;
    detail.classList.add("prepnuti");
    setTimeout(() => detail.classList.remove("prepnuti"), 320);
  } else {
    pozadi.classList.remove("otvira");
    void pozadi.offsetWidth;
    pozadi.classList.add("otvira");
  }
}

function vykresliObsahDetailu() {
  const vse = polozky();
  const p = vse.find((x) => x.cislo === otevrene);
  if (!p) return zavriDetail();

  const nahledy = p.nahledy || {};
  if (zobrazeni === "3d" && !nahledy.model3d) zobrazeni = "model";
  const adresa = zobrazeni === "3d" ? null : adresaObrazku(nahledy[zobrazeni]);
  const obraz = zobrazeni === "3d"
    ? `<div class="misto3d${animujNahled ? " anim-fade" : ""}" data-misto3d></div>`
    : adresa
    ? `<img src="${h(adresa)}" alt="Náhled ${zobrazeni === "vykres" ? "výkresu" : "dílu"} ${h(p.cislo)}" draggable="false"${animujNahled ? ' class="anim-fade"' : ""}>
       <button class="zvetsit" data-lupa="${h(adresa)}" title="Zvětšit"><span>Zvětšit</span></button>`
    : `<p class="nic">Náhled ${zobrazeni === "vykres" ? "výkresu" : "modelu"} zatím není.</p>`;

  const nic = `<span class="tlumene">—</span>`;
  const udaj = (popisek, obsah, trida = "") =>
    `<div class="udaj"><dt>${popisek}</dt><dd class="${trida}">${obsah}</dd></div>`;

  // Tlačítko s šipkou a pod ním obsah, který se plynule rozbalí.
  const sipka = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5 10 12.5 15 7.5"/></svg>`;
  const tlacitko = (klic, text) =>
    `<button class="historie-tl${rozbaleno[klic] ? " otevreno" : ""}" data-rozbal="${klic}">${text} ${sipka}</button>`;
  const obsah = (klic, html) =>
    `<div class="rozbal${rozbaleno[klic] ? " otevreno" : ""}" data-obsah="${klic}"><div>${html}</div></div>`;

  // Aktivní revize je vidět hned vedle, do počtu i seznamu patří jen ty
  // před ní — stejně jako „starší" u Vydáno (a jako v appce).
  const vsechnyRevize = p.historie || [];
  const historie = vsechnyRevize.length && vsechnyRevize[0].revize === p.revize
    ? vsechnyRevize.slice(1) : vsechnyRevize;
  const revize = `<div class="radek-udaje"><b>${h(p.revize) || "originál"}</b>`
    + (historie.length ? tlacitko("historie", `historie (${historie.length})`) : "")
    + `</div>`
    + (historie.length
      ? obsah("historie", `<ol class="denik">${historie.map((r) => `
          <li><b>${h(r.revize) || "originál"}</b><span class="kdy">${h(r.kdy)}</span>
            ${r.poznamka ? `<div class="poznamka">${h(r.poznamka)}</div>` : ""}</li>`).join("")}</ol>`)
      : "");

  // Vydáno: poslední vidět, starší na rozbalení — jako v appce.
  const vydani = p.vydani || [];
  const [posledni, ...starsi] = vydani;
  const vydaniRadek = (v) => `<b>${h(v.revize) || "originál"}</b><span class="kdy">${h(v.kdy)}</span>`;
  const vydano = !posledni
    ? `<span class="tlumene" style="font-style:normal">zatím nevydáno</span>`
    : `<div class="radek-udaje"><span>${vydaniRadek(posledni)}</span>`
      + (starsi.length ? tlacitko("vydani", `starší (${starsi.length})`) : "")
      + `</div>`
      + (starsi.length
        ? obsah("vydani", `<ol class="denik">${starsi.map((v) => `<li>${vydaniRadek(v)}</li>`).join("")}</ol>`)
        : "")
      + (p.vydano ? "" : `<div class="varovani">Aktuální revize ${h(p.revize) || "(originál)"} ještě vydaná není.</div>`);

  const udaje = [
    udaj("Stav", stitek(p.stav, true)),
    udaj("Typ", h(NAZVY_TYPU[p.typ] || p.typ) || nic),
    udaj("Materiál", h(p.material) || nic),
    udaj("Rozměr", p.rozmer ? `${h(p.rozmer)} mm` : nic),
    udaj("Revize", revize),
    udaj("Vydáno", vydano),
    udaj("Co se změnilo", h(p.poznamkaRevize) || nic, "vice-radku"),
    udaj("Vytvořeno", h(p.vytvoreno) || nic),
  ].join("");

  // Sousední čísla s popisem, jako v appce. Proklik jen na to, co je
  // v tomhle projektu — jinam zadavatel nevidí.
  const popisy = new Map(vse.map((x) => [x.cislo, x.popis]));
  const sloupec = (nadpis, cisla, napoveda) => `
    <div>
      <h3>${nadpis}${cisla.length ? `<span>${cisla.length}</span>` : ""}</h3>
      ${cisla.length === 0
        ? `<p class="prazdne">—</p>`
        : `<ul>${cisla.map((c) => {
            const klikaci = popisy.has(c);
            return `<li><button class="soused" ${klikaci ? `data-cislo="${h(c)}"` : "disabled"}>
              <span class="mono">${h(c)}</span>
              <span class="popis">${h(popisy.get(c) || "")}</span>
              ${klikaci ? `<span class="sipka">›</span>` : ""}
            </button></li>`;
          }).join("")}</ul>
          <p class="napoveda">${napoveda}</p>`}
    </div>`;
  const obsahuje = p.obsahuje || [];
  const pouzitoV = p.pouzitoV || [];
  const okoli = obsahuje.length || pouzitoV.length
    ? `<div class="okoli">
        ${sloupec("Skládá se z", obsahuje, "Přímé části, ne celý strom — co je uvnitř podsestav, je vidět u nich.")}
        ${sloupec("Používá se v", pouzitoV, "Sestavy, do kterých tenhle díl přímo patří.")}
      </div>`
    : "";

  $("detail").innerHTML = `
    <div class="hlava">
      <div>
        <div class="cislo">${h(p.cislo)}</div>
        <p class="popis${p.popis ? "" : " tlumene"}">${h(p.popis) || "bez popisu"}</p>
      </div>
      <button class="krizek" data-zavrit aria-label="Zavřít">×</button>
    </div>
    <div class="telo">
      <div class="levy">
        <div class="ramecek">${obraz}</div>
        <div class="prepinac">
          <button data-zobrazeni="model" class="${zobrazeni === "model" ? "aktivni" : ""}${nahledy.model ? "" : " chybi"}">Model</button>
          <button data-zobrazeni="vykres" class="${zobrazeni === "vykres" ? "aktivni" : ""}${nahledy.vykres ? "" : " chybi"}">Výkres</button>
          ${nahledy.model3d ? `<button data-zobrazeni="3d" class="${zobrazeni === "3d" ? "aktivni" : ""}">3D</button>` : ""}
        </div>
      </div>
      <dl class="udaje">${udaje}</dl>
    </div>
    ${okoli}
    <div class="sekce komentare">${komentareHtml(p.cislo, "Komentáře")}</div>`;

  const misto = $("detail").querySelector("[data-misto3d]");
  if (misto) vlozProhlizec(misto, adresaObrazku(nahledy.model3d));

  animujNahled = false;
  $("pozadi").hidden = false;
  document.body.style.overflow = "hidden";
}

// ── 3D náhled ──────────────────────────────────────────────
// Model chodí ve vlastním formátu JHM1 z appky (src-tauri/src/model3d.rs):
// přeškálovaný do ±1 a zhrubnutý, žádný .glb. Prohlížeč jen otáčí
// a přibližuje — měřit nejde. Je jeden na celou stránku a detail ho při
// každém překreslení jen znovu vloží, ať se otočení neztratí.

let prohlizec = null; // slib — three.js se stahuje až při prvním 3D
let tah3d = 0;        // poslední vložení; starší (ještě načítající) se zahodí
let lupa3d = false;   // prohlížeč je právě ve zvětšení
const modely3d = new Map(); // adresa → slib { pozice, indexy }

function nactiModel3d(adresa) {
  if (!modely3d.has(adresa)) {
    const slib = (async () => {
      const odpoved = await fetch(adresa);
      if (!odpoved.ok) throw new Error(`HTTP ${odpoved.status}`);
      const data = new Uint8Array(await odpoved.arrayBuffer());
      if (String.fromCharCode(...data.subarray(0, 4)) !== "JHM1") throw new Error("neznámý formát");
      const proud = new Blob([data.subarray(4)]).stream().pipeThrough(new DecompressionStream("deflate"));
      const s = new DataView(await new Response(proud).arrayBuffer());
      const n = s.getUint32(0, true);
      const m = s.getUint32(4, true);
      const pozice = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) pozice[i] = (s.getUint16(8 + 2 * i, true) / 65535) * 2 - 1;
      const indexy = new Uint32Array(m * 3);
      const od = 8 + n * 6;
      for (let i = 0; i < m * 3; i++) indexy[i] = s.getUint32(od + 4 * i, true);
      return { pozice, indexy };
    })();
    slib.catch(() => modely3d.delete(adresa)); // příště zkusit znovu
    modely3d.set(adresa, slib);
  }
  return modely3d.get(adresa);
}

async function vytvorProhlizec() {
  const [THREE, { OrbitControls }] = await Promise.all([
    import("three"),
    import("three/addons/controls/OrbitControls.js"),
  ]);

  const obal = document.createElement("div");
  obal.className = "prohlizec3d";
  obal.innerHTML = `
    <p class="stav3d"></p>
    <div class="vodoznak3d" aria-hidden="true"><span>NÁHLED — NEPLATNÝ PRO VÝROBU</span></div>
    <p class="napoveda3d">Tažením otočíte, kolečkem přiblížíte</p>
    <button class="zvetsit3d" data-lupa3d>Zvětšit</button>`;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0xffffff);
  obal.prepend(renderer.domElement);

  const scena = new THREE.Scene();
  const kamera = new THREE.PerspectiveCamera(30, 1.41, 0.01, 100);
  scena.add(new THREE.HemisphereLight(0xffffff, 0x8796a3, 2.4));
  // Hlavní světlo jde s kamerou — model je nasvícený, ať se otočí kamkoli.
  const svetlo = new THREE.DirectionalLight(0xffffff, 1.9);
  svetlo.position.set(1, 2, 3);
  kamera.add(svetlo);
  scena.add(kamera);

  const ovladani = new OrbitControls(kamera, renderer.domElement);
  ovladani.enablePan = false;
  ovladani.enableDamping = true;
  ovladani.dampingFactor = 0.12;

  const material = new THREE.MeshStandardMaterial({
    color: 0xc9d3db, metalness: 0.1, roughness: 0.65, flatShading: true, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  });
  const materialHran = new THREE.LineBasicMaterial({ color: 0x40566a });
  let sit = null;
  let hrany = null;

  let kreslit = true;
  let bezi = false;
  ovladani.addEventListener("change", () => (kreslit = true));
  ovladani.addEventListener("start", () => obal.classList.add("pouzito"));
  // Kreslí se jen při pohybu; smyčka skončí, když prohlížeč není na stránce.
  const smycka = () => {
    if (!renderer.domElement.isConnected) return (bezi = false);
    if (ovladani.update() || kreslit) {
      renderer.render(scena, kamera);
      kreslit = false;
    }
    requestAnimationFrame(smycka);
  };
  new ResizeObserver(() => {
    const w = obal.clientWidth;
    const v = obal.clientHeight;
    if (!w || !v) return;
    renderer.setSize(w, v, false);
    kamera.aspect = w / v;
    kamera.updateProjectionMatrix();
    kreslit = true;
  }).observe(obal);

  return {
    obal,
    adresa: null,
    spust() {
      kreslit = true;
      if (!bezi) {
        bezi = true;
        requestAnimationFrame(smycka);
      }
    },
    stav(text) {
      obal.querySelector(".stav3d").textContent = text;
    },
    ukaz(model) {
      if (sit) {
        scena.remove(sit, hrany);
        sit.geometry.dispose();
        hrany.geometry.dispose();
        sit = hrany = null;
      }
      kreslit = true;
      if (!model) return;
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(model.pozice, 3));
      g.setIndex(new THREE.BufferAttribute(model.indexy, 1));
      g.computeBoundingSphere();
      sit = new THREE.Mesh(g, material);
      // Obrys jen na ostrých hranách — zaoblení z trojúhelníků zůstanou hladká.
      hrany = new THREE.LineSegments(new THREE.EdgesGeometry(g, 40), materialHran);
      scena.add(sit, hrany);

      // Izometrie jako v SolidWorksu, celý model v záběru.
      const { center, radius } = g.boundingSphere;
      const vzdalenost = radius / Math.sin(THREE.MathUtils.degToRad(kamera.fov / 2)) * 1.08;
      ovladani.target.copy(center);
      kamera.position.set(1, 1, 1).normalize().multiplyScalar(vzdalenost).add(center);
      ovladani.minDistance = radius * 0.8;
      ovladani.maxDistance = vzdalenost * 4;
      ovladani.update();
      obal.classList.remove("pouzito");
    },
  };
}

async function vlozProhlizec(misto, adresa) {
  if (lupa3d) {
    misto.innerHTML = `<p class="nic" style="position:absolute;inset:0;display:grid;place-items:center">3D je otevřené ve zvětšení.</p>`;
    return;
  }
  const tah = ++tah3d;
  let p;
  try {
    prohlizec ??= vytvorProhlizec();
    p = await prohlizec;
  } catch (e) {
    prohlizec = null; // třeba nedostupné CDN — příště znovu
    if (misto.isConnected) misto.innerHTML = `<p class="nic">3D náhled se nepodařilo spustit.</p>`;
    return;
  }
  if (tah !== tah3d || !misto.isConnected) return;
  misto.replaceChildren(p.obal);
  p.spust();
  if (p.adresa === adresa) return;

  p.adresa = adresa;
  p.ukaz(null);
  p.stav("Načítám 3D…");
  try {
    const model = await nactiModel3d(adresa);
    if (p.adresa !== adresa) return;
    p.stav("");
    p.ukaz(model);
  } catch (e) {
    if (p.adresa !== adresa) return;
    p.adresa = null;
    p.stav("3D náhled se nepodařilo načíst.");
  }
}

async function otevriLupu3d() {
  const p = await prohlizec;
  const misto = p.obal.parentElement;
  lupa3d = true;
  const lupa = $("lupa");
  lupa.innerHTML = `<button class="zavrit" data-zavrit-lupu>Zavřít</button>`;
  lupa.append(p.obal);
  if (misto) vlozProhlizec(misto, null); // v detailu zůstane jen poznámka
  lupa.classList.remove("plna", "zavira", "otvira");
  lupa.hidden = false;
  void lupa.offsetWidth;
  lupa.classList.add("otvira");
  p.spust();
}

// ── Události ───────────────────────────────────────────────

document.addEventListener("click", (e) => {
  // Klik vedle karty (na ztmavené pozadí) detail zavře — jen když tam
  // i začal, ne když otáčení 3D modelu skončí kurzorem mimo kartu.
  if (e.target === $("pozadi")) return stiskNaPozadi ? zavriDetail() : undefined;
  const cil = e.target.closest(
    "[data-cislo], [data-zavrit], [data-zobrazeni], [data-lupa], [data-lupa3d], [data-zavrit-lupu], [data-rozbal], [data-obnovit], #lupa img"
  );
  if (!cil || cil.matches("form")) return;
  if (cil.matches("#lupa img")) return $("lupa").classList.toggle("plna");
  if (cil.matches("[data-zavrit-lupu]")) return zavriLupu();
  if (cil.matches("[data-obnovit]")) return obnovRucne();
  if (cil.matches("[data-lupa3d]")) return otevriLupu3d();
  if (cil.matches("[data-lupa]")) return otevriLupu(cil.dataset.lupa);
  if (cil.matches("[data-zavrit]")) return zavriDetail();
  if (cil.matches("[data-rozbal]")) {
    // Bez překreslení — třída na prvku, ať se rozbalení animuje.
    const klic = cil.dataset.rozbal;
    rozbaleno[klic] = !rozbaleno[klic];
    cil.classList.toggle("otevreno", rozbaleno[klic]);
    $("detail").querySelector(`[data-obsah="${klic}"]`)?.classList.toggle("otevreno", rozbaleno[klic]);
    return;
  }
  if (cil.matches("[data-zobrazeni]")) {
    if (zobrazeni === cil.dataset.zobrazeni) return;
    zobrazeni = cil.dataset.zobrazeni;
    animujNahled = true;
    return vykresliDetail();
  }
  if (cil.dataset.cislo) otevriDetail(cil.dataset.cislo);
});

document.addEventListener("pointerdown", (e) => {
  stiskNaPozadi = e.target === $("pozadi");
});

document.addEventListener("submit", (e) => {
  if (e.target.id === "heslo") {
    e.preventDefault();
    return odesliHeslo(e.target);
  }
  if (!e.target.matches(".formular")) return;
  e.preventDefault();
  odesliKomentar(e.target);
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("lupa").hidden) zavriLupu();
  else if (otevrene) zavriDetail();
});

// Obrázky se nestahují přes pravé tlačítko ani tažením. Neznemožní to
// snímek obrazovky — proto je na nich vodoznak —, ale nepozve k tomu.
document.addEventListener("contextmenu", (e) => {
  if (e.target.closest(".ramecek, .lupa")) e.preventDefault();
});

// ── Start ──────────────────────────────────────────────────

// Vložený jiný odkaz do téže záložky mění jen část za #, a to prohlížeč
// stránku znovu nenačte — kód se ale čte jen při startu.
window.addEventListener("hashchange", () => location.reload());

if (!kod) {
  zobrazHlasku("Neúplný odkaz", "Odkaz na náhled projektu končí dlouhým kódem za znakem #. Zkopírujte ho prosím celý.");
} else {
  obnov();
  setInterval(() => { if (!document.hidden) obnov(); }, OBNOVA_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) obnov(); });
}

function obrazekUkazky(text, vykres) {
  const svg = vykres
    ? `<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="1000"><rect width="1410" height="1000" fill="#fff"/><rect x="30" y="30" width="1350" height="940" fill="none" stroke="#222" stroke-width="3"/><rect x="200" y="260" width="620" height="300" fill="none" stroke="#222" stroke-width="4"/><path d="M200 620h620M200 600v40M820 600v40" stroke="#222" stroke-width="2"/><text x="470" y="660" font-family="Arial" font-size="32">620</text><rect x="830" y="780" width="550" height="190" fill="none" stroke="#222" stroke-width="2"/><text x="860" y="900" font-family="Arial" font-size="56">${text}</text><text x="380" y="520" font-family="Arial" font-size="60" fill="#c42626" opacity=".3" transform="rotate(-28 700 500)">NÁHLED — UKÁZKA</text></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="760"><rect width="1024" height="760" fill="#fff"/><path d="M300 480l280-150 220 110-280 150z" fill="#9fb2c2"/><path d="M300 480v60l220 110v-60z" fill="#6c8193"/><path d="M520 590v60l280-150v-60z" fill="#7f95a8"/><text x="512" y="720" text-anchor="middle" font-family="Arial" font-size="30" fill="#5d7488">${text}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
